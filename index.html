<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERRUPT - Stop the Scroll in 0.8 Seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:opsz,wght@14..32,400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6A00;
    --violet: #3B1F8F;
    --violet-bright: #6B4FD8;
    --charcoal: #1C1C1E;
    --paper: #FBFAF8;
    --ink: #201F26;
    --ink-soft: #55535E;
    --line: #E3E0DA;
    --card-bg: #F4F1EC;
    --max: 1080px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; margin: 0; }
  p { margin: 0; }
  a { color: inherit; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

  /* ---------- Nav ---------- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 28px;
    max-width: var(--max);
    margin: 0 auto;
  }
  .nav .mark {
    height: 30px;
    display: block;
  }
  .nav a.navlink {
    font-size: 14px;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .nav a.navlink:hover { border-bottom-color: var(--orange); color: var(--ink); }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(160deg, #1C1C1E 0%, #241531 65%, #1C1C1E 100%);
    color: #fff;
    padding: 64px 0 84px;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 56px;
    align-items: center;
  }
  .hero h1 {
    font-size: 44px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
  }
  .hero .lede {
    font-size: 17px;
    color: #D8D3E6;
    max-width: 46ch;
    margin-bottom: 32px;
  }
  .hero .lede strong { color: #fff; }

  form.capture {
    display: flex;
    gap: 10px;
    max-width: 460px;
    margin-bottom: 14px;
  }
  form.capture input[type="email"] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
  }
  form.capture input[type="email"]::placeholder { color: #9B93AE; }
  form.capture input[type="email"]:focus {
    border-color: var(--orange);
    background: rgba(255,255,255,0.09);
  }
  form.capture button {
    padding: 14px 22px;
    border-radius: 3px;
    border: none;
    background: var(--orange);
    color: #1C1C1E;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  form.capture button:hover { background: #ff7f1f; }
  form.capture button:disabled { opacity: 0.6; cursor: default; }

  .hero .fineprint { font-size: 13px; color: #837C99; }
  .hero .fineprint a { color: #B7A9E8; text-decoration: underline; }

  .form-success {
    display: none;
    max-width: 460px;
    padding: 16px 18px;
    border-radius: 3px;
    background: rgba(255,106,0,0.12);
    border: 1px solid rgba(255,106,0,0.4);
    font-size: 14.5px;
    color: #FFD9BA;
    margin-bottom: 14px;
  }
  .form-success.show { display: block; }
  .capture-block.hide-form form.capture,
  .capture-block.hide-form .fineprint { display: none; }

  .ghl-form-wrap {
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .final-cta .ghl-form-wrap { text-align: left; max-width: 460px; margin-left: auto; margin-right: auto; }

  /* Live prompt card in hero */
  .prompt-demo {
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .prompt-demo .pd-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,0,0,0.28);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .prompt-demo .pd-head .pd-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: #C9BEEF;
  }
  .prompt-demo .pd-head .pd-tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--orange);
    font-weight: 700;
  }
  .prompt-demo .pd-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.3px;
    line-height: 1.65;
    color: #E7E4EE;
    padding: 18px 16px;
  }
  .prompt-demo .pd-body .cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: var(--orange);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .prompt-demo .pd-foot {
    display: flex;
    gap: 18px;
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
    color: #837C99;
  }
  .prompt-demo .pd-foot b { color: #C23B2A; font-weight: 600; }

  /* ---------- Mechanism strip ---------- */
  .mechanism {
    padding: 56px 0;
    border-bottom: 1px solid var(--line);
  }
  .mechanism .kicker {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--violet);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .mechanism h2 { font-size: 26px; max-width: 24ch; margin-bottom: 30px; }
  .mech-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .mech-item .num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--orange);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .mech-item h3 { font-size: 17px; margin-bottom: 8px; }
  .mech-item p { font-size: 14.5px; color: var(--ink-soft); }

  /* ---------- 12 categories ---------- */
  .categories { padding: 64px 0; }
  .categories .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; gap: 24px; flex-wrap: wrap; }
  .categories h2 { font-size: 26px; max-width: 20ch; }
  .categories .head p { font-size: 14.5px; color: var(--ink-soft); max-width: 34ch; }

  .cat-list { border-top: 1px solid var(--line); }
  .cat-row {
    display: grid;
    grid-template-columns: 44px 1.3fr 1.7fr;
    gap: 18px;
    align-items: baseline;
    padding: 15px 0;
    border-bottom: 1px solid var(--line);
  }
  .cat-row .cn {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--orange);
    font-weight: 700;
    font-size: 14px;
  }
  .cat-row .cname { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: var(--charcoal); }
  .cat-row .cline { font-size: 14px; color: var(--ink-soft); font-style: italic; }

  /* ---------- What's inside ---------- */
  .inside { padding: 64px 0; background: var(--card-bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .inside-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
  .inside h2 { font-size: 26px; margin-bottom: 16px; max-width: 18ch; }
  .inside .lede { font-size: 15px; color: var(--ink-soft); margin-bottom: 22px; }
  .inside ul { list-style: none; margin: 0; padding: 0; }
  .inside li {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 14.5px;
    color: var(--ink);
  }
  .inside li:last-child { border-bottom: 1px solid var(--line); }
  .inside li .dot { color: var(--orange); font-weight: 700; flex: none; }
  .inside .price-note {
    margin-top: 26px;
    padding: 16px 18px;
    background: var(--charcoal);
    color: #fff;
    border-radius: 3px;
    font-size: 14px;
  }
  .inside .price-note strong { color: var(--orange); }

  /* ---------- Services / DFY tier ---------- */
  .services { padding: 64px 0 72px; }
  .services .head { margin-bottom: 30px; }
  .services h2 { font-size: 26px; margin-bottom: 8px; }
  .services .head p { font-size: 14.5px; color: var(--ink-soft); }

  .tier-list { border-top: 1px solid var(--line); }
  .tier-row {
    display: grid;
    grid-template-columns: 1fr 2fr 1.3fr;
    gap: 20px;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .tier-row .tier-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15.5px; color: var(--charcoal); }
  .tier-row .tier-desc { font-size: 14px; color: var(--ink-soft); }
  .tier-row .tier-for { font-size: 12.5px; color: var(--violet); font-weight: 600; }
  .tier-row.tier-highlight { background: var(--card-bg); margin: 0 -20px; padding: 18px 20px; border-bottom: 1px solid var(--line); border-radius: 3px; }
  .tier-row.tier-highlight .tier-name { color: var(--orange); }

  .dfy-note {
    margin-top: 26px;
    padding: 16px 18px;
    background: var(--charcoal);
    color: #fff;
    border-radius: 3px;
    font-size: 14px;
  }
  .dfy-note strong { color: var(--orange); }
  .dfy-note a { color: #fff; text-decoration: underline; }
  .dfy-note em { color: #C9BEEF; }


  /* ---------- Real Results (proof) ---------- */
  .proof { padding: 64px 0 60px; background: var(--charcoal); }
  .proof .head { margin-bottom: 8px; }
  .proof .kicker { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--orange); font-weight: 700; margin-bottom: 10px; }
  .proof h2 { font-size: 26px; color: #fff; max-width: 26ch; margin-bottom: 10px; }
  .proof .head p { font-size: 14.5px; color: #B7A9E8; max-width: 50ch; margin-bottom: 34px; }

  .proof-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .proof-card { background: #100F14; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
  .proof-card .shot-wrap { height: 230px; overflow: hidden; }
  .proof-card .shot-wrap img { width: 100%; display: block; }
  .proof-card .cap { padding: 14px 16px 18px; }
  .proof-card .cap .stat { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: #fff; margin-bottom: 8px; }
  .proof-card .cap .mech-tag {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--orange);
    background: rgba(255,106,0,0.12);
    border: 1px solid rgba(255,106,0,0.35);
    border-radius: 3px;
    padding: 3px 8px;
    margin-bottom: 10px;
  }
  .proof-card .cap .note { font-size: 13px; color: #B7AFC9; line-height: 1.5; }
  .proof-source { margin-top: 18px; font-size: 12.5px; color: #6B6480; }

  .watch-card {
    margin-top: 26px;
    padding: 20px 22px;
    background: #100F14;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
  }
  .watch-card .wc-head { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #fff; margin-bottom: 3px; }
  .watch-card .wc-sub { font-size: 12.5px; color: #837C99; margin-bottom: 16px; }
  .watch-group { margin-bottom: 12px; }
  .watch-group:last-child { margin-bottom: 0; }
  .watch-group .wg-label { font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6480; margin-bottom: 8px; }
  .watch-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .watch-btns a {
    display: inline-block;
    padding: 7px 14px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: #E7E4EE;
    text-decoration: none;
    font-size: 13px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .watch-btns a:hover { border-color: var(--orange); color: var(--orange); }

  /* ---------- Final CTA ---------- */
  .final-cta { padding: 72px 0 80px; text-align: center; }
  .final-cta h2 { font-size: 30px; max-width: 22ch; margin: 0 auto 14px; }
  .final-cta p { font-size: 15.5px; color: var(--ink-soft); max-width: 44ch; margin: 0 auto 28px; }
  .final-cta .cta-button {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 3px;
    background: var(--orange);
    color: #1C1C1E;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    transition: background 0.15s ease;
    margin-bottom: 14px;
  }
  .final-cta .cta-button:hover { background: #ff7f1f; }
  .final-cta .fineprint { display: block; color: var(--ink-soft); }
  .final-cta .fineprint a { color: var(--violet); }

  /* ---------- Footer ---------- */
  footer {
    padding: 32px 0 40px;
    border-top: 1px solid var(--line);
  }
  footer .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  footer .fmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; color: var(--ink-soft); }
  footer a.contact { font-size: 13.5px; color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a.contact:hover { color: var(--orange); border-color: var(--orange); }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .hero h1 { font-size: 34px; }
    .mech-list { grid-template-columns: 1fr; gap: 26px; }
    .inside-grid { grid-template-columns: 1fr; gap: 32px; }
    .cat-row { grid-template-columns: 32px 1fr; }
    .cat-row .cline { grid-column: 2 / 3; }
    .tier-row { grid-template-columns: 1fr; gap: 6px; }
    .tier-row.tier-highlight { margin: 0; }
    .proof-grid { grid-template-columns: 1fr; gap: 18px; }
    form.capture { flex-direction: column; }
    form.capture button { width: 100%; }
    .final-cta .cta-button { width: 100%; max-width: 460px; }
  }
</style>
</head>
