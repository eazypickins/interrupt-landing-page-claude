<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hooking Audiences in Under 1 Second</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0A0A0C;
      --bg-card: #141418;
      --orange: #FF6B00;
      --text-main: #FFFFFF;
      --text-muted: #A0A0AA;
      --border: #27272A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.2;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- Hero Section ---------- */
    .hero {
      padding: 80px 0 60px;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero p.subheadline {
      font-size: 20px;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 40px;
    }

    .ghl-form-wrap {
      max-width: 500px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    /* ---------- Final CTA ---------- */
    .final-cta {
      padding: 80px 0;
      text-align: center;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    .final-cta h2 {
      font-size: 36px;
      margin-bottom: 16px;
    }

    .final-cta p {
      color: var(--text-muted);
      font-size: 18px;
      max-width: 550px;
      margin: 0 auto 32px;
    }

    .final-cta .cta-button {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 4px;
      background: var(--orange);
      color: #1C1C1E;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .final-cta .cta-button:hover {
      background: #ff7f1f;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <div class="wrap">
      <h1>Hook Audiences in <span>Under 1 Second</span></h1>
      <p class="subheadline">Get the exact high-converting hook prompts designed for modern content creators and brands.</p>

      <!-- Target ID added to top form container -->
      <div class="ghl-form-wrap" id="hero-form">
        <!-- Replace the iframe below with your exact GoHighLevel embed script -->
        <iframe
          src="https://leadconnectorhq.com/widget/form/YOUR_FORM_ID_HERE"
          style="width:100%;height:100%;border:none;border-radius:4px;"
          id="inline-YOUR_FORM_ID_HERE" 
          data-layout="{'id':'INLINE'}"
          data-trigger-type="alwaysShow"
          data-trigger-value=""
          data-activation-type="alwaysActivate"
          data-activation-value=""
          data-deactivation-type="neverDeactivate"
          data-deactivation-value=""
          title="Optin Form">
        </iframe>
        <script src="https://leadconnectorhq.com/js/form_embed.js"></script>
      </div>
    </div>
  </section>

  <!-- Final CTA Section -->
  <section class="final-cta">
    <div class="wrap">
      <h2>Stop scrolling. Start dominating.</h2>
      <p>Get instant access to the exact prompts top creators use to hook audiences in under a second.</p>

      <!-- Smooth scroll CTA button pointing to hero form -->
      <a href="#hero-form" class="cta-button">Get The Free Prompts Now</a>
    </div>
  </section>

</body>
</html>
